<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>When Central Banks Go Broke</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060a11;color:#b0bdd0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}

.hdr{padding:10px 16px;border-bottom:1px solid #151e30;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;flex-shrink:0;z-index:100;background:#080c15}
.hdr h1{font-size:18px;font-weight:700;color:#e8eef6;letter-spacing:-0.3px}
.hdr .sub{font-size:10px;color:#3e506a;letter-spacing:1.4px;text-transform:uppercase;margin-left:10px}
.filters{display:flex;gap:3px;flex-wrap:wrap}
.fbtn{padding:4px 10px;border:1px solid #151e30;background:0;color:#3e506a;font:500 10px/1 system-ui;cursor:pointer;border-radius:3px;display:flex;align-items:center;gap:5px;transition:.15s;letter-spacing:.4px;text-transform:uppercase}
.fbtn:hover{border-color:#253050;color:#8090aa}
.fbtn.on{background:#111827;color:#dde5f0;border-color:#253050}
.fdot{width:7px;height:7px;border-radius:50%;display:inline-block}

.map-wrap{flex:1;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%}

.ctrl{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:2px;z-index:50}
.ctrl button{width:34px;height:34px;border:1px solid #151e30;background:rgba(8,12,21,.88);color:#7888a0;font-size:17px;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:inherit;backdrop-filter:blur(6px)}
.ctrl button:hover{background:#111827;color:#d0daea}

.stats{position:absolute;top:10px;right:10px;display:flex;gap:4px;z-index:50}
.stat{background:rgba(8,12,21,.88);border:1px solid #151e30;border-radius:4px;padding:5px 10px;text-align:center;backdrop-filter:blur(6px)}
.stat .n{font-size:18px;font-weight:700}
.stat .l{font-size:8px;color:#3e506a;text-transform:uppercase;letter-spacing:.8px}

.legend{position:absolute;bottom:48px;left:10px;background:rgba(8,12,21,.9);border:1px solid #151e30;border-radius:5px;padding:10px 14px;z-index:50;backdrop-filter:blur(6px)}
.legend .t{font-size:8px;color:#3e506a;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.legend .r{display:flex;align-items:center;gap:7px;padding:2px 0;font-size:10px;color:#7888a0}
.legend .d{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.tl{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(8,12,21,.9);border:1px solid #151e30;border-radius:5px;padding:6px 14px;display:flex;align-items:center;gap:3px;z-index:50;backdrop-filter:blur(6px);max-width:calc(100vw - 40px);overflow-x:auto}
.tl .yr{font-size:8px;color:#2a3a54;padding:0 4px;white-space:nowrap}
.tl .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;cursor:pointer;transition:.15s;border:1.5px solid transparent}
.tl .dot:hover{transform:scale(1.5)}
.tl .dot.sel{border-color:#fff;transform:scale(1.4)}

.tooltip{position:absolute;pointer-events:none;z-index:200;background:rgba(10,15,25,.94);border:1px solid #1a2540;border-radius:5px;padding:8px 12px;font-size:11px;max-width:220px;backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.5);transition:opacity .12s;white-space:nowrap}
.tooltip .tn{font-size:13px;font-weight:600;color:#e8eef6}
.tooltip .tm{font-size:9px;color:#3e506a;margin-top:2px}
.tooltip .tt{display:inline-block;padding:1px 6px;border-radius:2px;font-size:9px;margin-top:4px;font-weight:500}

.panel{position:absolute;top:10px;right:10px;width:380px;max-width:calc(100vw - 24px);max-height:calc(100vh - 100px);overflow-y:auto;background:rgba(10,15,25,.96);border:1px solid #1a2540;border-radius:8px;z-index:150;backdrop-filter:blur(12px);box-shadow:0 12px 48px rgba(0,0,0,.6)}
.panel .bar{height:3px;border-radius:8px 8px 0 0}
.panel .inner{padding:16px 20px}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start}
.panel .pn{font-size:18px;font-weight:700;color:#e8eef6}
.panel .pm{font-size:10px;color:#3e506a;margin-top:3px;letter-spacing:.5px}
.panel .pt{display:inline-block;margin-top:8px;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:500}
.panel .ps{font-size:12px;line-height:1.65;color:#8898b0;margin-top:10px}
.panel .pg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.panel .pb{padding:8px 10px;background:#080c14;border-radius:4px;border:1px solid #111827}
.panel .pl{font-size:8px;color:#2a3a54;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.panel .pv{font-size:11px;color:#7888a0;line-height:1.5}
.panel .close{background:0;border:1px solid #1a2540;color:#4a5a72;width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.panel .close:hover{color:#ddd;border-color:#3a4a62}
</style>
</head>

  </div>
  <div class="tl" id="timeline"></div>
  <div class="tooltip" id="tip" style="opacity:0"></div>
  <div class="panel" id="panel" style="display:none"></div>
</div>

const CASES = [{"id":1,"name":"Bank of Amsterdam","country":"Netherlands","year":1790,"yearEnd":1819,"lat":52.37,"lng":4.9,"severity":"fatal","type":"Insolvency & Closure","summary":"The world's first proto-central bank declared insolvency in 1790 after the Dutch East India Company defaulted on massive unsecured loans. Without fiscal support from Amsterdam, trust collapsed \u2014 the premium on bank guilders fell below zero. The bank lingered until 1819 but never recovered.","cause":"VOC loan defaults, Anglo-Dutch War, no fiscal backstop","outcome":"Bank dissolved; guilder lost reserve currency status"},{"id":2,"name":"Reichsbank","country":"Weimar Germany","year":1923,"lat":52.52,"lng":13.4,"severity":"fatal","type":"Hyperinflation","summary":"After WWI, Germany faced crushing war reparations. The Reichsbank printed marks to buy foreign currency, triggering the worst hyperinflation in an industrialized economy. By Nov 1923, prices doubled every 3.7 days. The mark became worthless.","cause":"War reparations, money printing, economic devastation","outcome":"Currency abandoned; Rentenmark introduced"},{"id":3,"name":"Hungarian National Bank","country":"Hungary","year":1946,"lat":47.5,"lng":19.04,"severity":"fatal","type":"Worst Hyperinflation Ever","summary":"Post-WWII Hungary: 40% of capital stock destroyed, crushing Soviet reparations consuming ~50% of budget. Peak monthly inflation hit 41.9 quadrillion percent \u2014 prices doubled every 15.3 hours. The highest denomination note ever printed: 100 quintillion peng\u0151.","cause":"WWII devastation, Soviet reparations, money printing","outcome":"Peng\u0151 abandoned; replaced by forint (Aug 1946)"},{"id":4,"name":"Banco Central de Chile","country":"Chile","year":1982,"lat":-33.45,"lng":-70.67,"severity":"chronic","type":"Persistent Negative Equity","summary":"Chile's central bank absorbed enormous losses during the 1982 banking crisis by taking on nonperforming loans. For decades it operated with negative equity exceeding 20% of assets \u2014 yet maintained credible monetary policy. The textbook case that central banks can function with negative capital.","cause":"Banking crisis bailout, quasi-fiscal operations","outcome":"Still operates with negative equity; credibility maintained"},{"id":5,"name":"Central Reserve Bank of Peru","country":"Peru","year":1987,"yearEnd":1990,"lat":-12.05,"lng":-77.04,"severity":"fatal","type":"Quasi-Fiscal Collapse","summary":"Under the Garcia administration, quasi-fiscal losses exceeded 5% of GDP in 1987, financed by money creation. Inflation exploded to over 7,000% by 1990. A new central bank law under Fujimori eventually stabilized the economy.","cause":"Government deficit financing, money creation","outcome":"Hyperinflation; central bank reform in 1990s"},{"id":6,"name":"Banco Central do Brasil","country":"Brazil","year":1990,"yearEnd":1994,"lat":-15.79,"lng":-47.88,"severity":"critical","type":"Hyperinflation","summary":"Brazil suffered decades of high inflation peaking at over 2,000% in 1993. Multiple currencies failed. The creative Plano Real (1994) introduced a virtual currency (URV) to rebuild trust, then converted to the real.","cause":"Chronic fiscal deficits, money printing, institutional failure","outcome":"Plano Real stabilization (1994); new currency"},{"id":7,"name":"Banco Central de Costa Rica","country":"Costa Rica","year":1990,"yearEnd":2007,"lat":9.93,"lng":-84.08,"severity":"critical","type":"Quasi-Fiscal Losses","summary":"Costa Rica's central bank accumulated significant quasi-fiscal losses from subsidized lending and FX operations. Losses undermined monetary policy and required government recapitalization totaling over 7% of GDP (2000\u20132007).","cause":"Quasi-fiscal operations, subsidized lending, FX losses","outcome":"Government recapitalization (>7% GDP)"},{"id":8,"name":"Bank of Mexico","country":"Mexico","year":1995,"lat":19.43,"lng":-99.13,"severity":"chronic","type":"Periodic Negative Equity","summary":"Following the 1994 Tequila Crisis, the Bank of Mexico experienced negative capital and has periodically operated with negative equity from FX reserve costs. Cited alongside Chile and Czech Republic as a successful example.","cause":"Tequila Crisis aftermath, FX reserve management","outcome":"Operated effectively despite periodic negative equity"},{"id":9,"name":"Czech National Bank","country":"Czech Republic","year":1999,"lat":50.09,"lng":14.42,"severity":"chronic","type":"Persistent Negative Equity","summary":"Negative equity up to 5% of GDP for over two decades, from FX intervention losses during the transition economy. Maintained effective monetary policy and price stability throughout \u2014 no ill effects on reputation.","cause":"FX reserve valuation losses, transition-era operations","outcome":"Operating normally despite decades of negative equity"},{"id":10,"name":"Bank of Israel","country":"Israel","year":2002,"lat":32.07,"lng":34.78,"severity":"chronic","type":"Persistent Negative Equity","summary":"Persistent negative equity at times exceeding 20% of assets from FX reserve management. Continued effective monetary policy, demonstrating negative equity need not impair operations when trust is high.","cause":"FX reserve losses, exchange rate appreciation","outcome":"Operating effectively with negative equity"},{"id":11,"name":"Central Bank of Iceland","country":"Iceland","year":2008,"lat":64.15,"lng":-21.94,"severity":"critical","type":"Near-Insolvency","summary":"Iceland's banking system \u2014 10\u00d7 GDP \u2014 collapsed in 2008. The central bank couldn't supply foreign currency and faced functional insolvency. The kr\u00f3na lost ~50% of value. IMF bailout followed with capital controls lasting until 2017.","cause":"Oversized banking sector, currency mismatch","outcome":"IMF bailout; capital controls until 2017"},{"id":12,"name":"Reserve Bank of Zimbabwe","country":"Zimbabwe","year":2008,"lat":-17.83,"lng":31.05,"severity":"fatal","type":"Currency Abandonment","summary":"The worst 21st-century central bank failure. After land reform collapsed agriculture and revenues cratered, the central bank printed money. Peak: 79.6 billion %/month (Nov 2008) \u2014 prices doubling every 24.7 hours. Zimbabwe dollar abandoned for USD.","cause":"Land reform collapse, revenue collapse, money printing","outcome":"Currency abandoned; dollarization (2009)"},{"id":13,"name":"Banco Central de Venezuela","country":"Venezuela","year":2016,"yearEnd":2021,"lat":10.49,"lng":-66.88,"severity":"fatal","type":"Hyperinflation","summary":"Hyperinflation from late 2016 driven by collapsing oil prices, mismanagement, and money printing. Inflation peaked ~930,000% in 2018 (IMF). The bol\u00edvar lost virtually all value. Government crypto (Petro) failed.","cause":"Oil price collapse, mismanagement, corruption","outcome":"Currency effectively destroyed; de facto dollarization"},{"id":14,"name":"Swiss National Bank","country":"Switzerland","year":2022,"lat":46.95,"lng":7.45,"severity":"stressed","type":"Record Losses (Survived)","summary":"CHF 132.5B loss in 2022 \u2014 largest in 116 years (~18% of Swiss GDP) \u2014 from its massive FX portfolio. Equity fell but stayed positive. Payouts to Swiss governments suspended but operations unaffected.","cause":"Rising rates, strong franc, portfolio losses","outcome":"Survived; no payout 2022\u20132023"},{"id":15,"name":"Federal Reserve System","country":"United States","year":2022,"lat":38.89,"lng":-77.05,"severity":"stressed","type":"Negative Capital (Ongoing)","summary":"Losses from Sept 2022 at ~$2B/week. Cumulative ~$154B by early 2024. Eight of twelve regional Fed banks technically insolvent (mark-to-market). Losses booked as 'deferred assets' \u2014 an IOU to itself.","cause":"Rate hikes made QE-era portfolio deeply unprofitable","outcome":"Technically insolvent (mark-to-market); continues operating"},{"id":16,"name":"Reserve Bank of Australia","country":"Australia","year":2022,"lat":-33.87,"lng":151.21,"severity let W, H, dpr;
let cx = 0, cy = 0, scale = 1;
let dragging = false, dragX, dragY, dragCx, dragCy;
let filter = 'all';
let selected = null;
let hovered = null;
let animFrame;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  cv.width = W * dpr;
  cv.height = H * dpr;
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener('resize', resize);

// Mercator projection
function proj(lat, lng) {
  const x = W/2 + (lng - cx) * (W / 360) * scale;
  const latR = lat * Math.PI / 180;
  const merc = Math.log(Math.tan(Math.PI/4 + latR/2));
  const cyR = cy * Math.PI / 180;
  const mercCy = Math.log(Math.tan(Math.PI/4 + cyR/2));
  const y = H/2 - (merc - mercCy) * (W / (2 * Math.PI)) * scale;
  return [x, y];
}

function unproj(px, py) {
  const lng = (px - W/2) / (W / 360) / scale + cx;
  const cyR = cy * Math.PI / 180;
  const mercCy = Math.log(Math.tan(Math.PI/4 + cyR/2));
  const merc = mercCy - (py - H/2) / ((W / (2 * Math.PI)) * scale);
  const lat = (2 * Math.atan(Math.exp(merc)) - Math.PI/2) * 180 / Math.PI;
  return [lat, lng];
}

// Draw
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Ocean gradient
  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H));
  grad.addColorStop(0, '#0b1018');
  grad.addColorStop(1, '#060a11');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Graticule
  ctx.strokeStyle = '#0e1520';
  ctx.lineWidth = 0.5;
  for (let lng = -180; lng <= 180; lng += 30) {
    ctx.beginPath();
    for (let lat = -85; lat <= 85; lat += 2) {
      const [x, y] = proj(lat, lng);
      lat === -85 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  for (let lat = -60; lat <= 80; lat += 30) {
    ctx.beginPath();
    for (let lng = -180; lng <= 180; lng += 2) {
      const [x, y] = proj(lat, lng);
      lng === -180 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // Countries
  ctx.fillStyle = '#111a28';
  ctx.strokeStyle = '#1c2a42';
  ctx.lineWidth = 0.6;
  for (const feat of GEO.features) {
    drawGeom(feat.geometry);
  }

  // Cities (only at sufficient zoom)
  if (scale >= 1.5) {
    const fs = Math.max(8, Math.min(11, 9 * scale / 2));
    ctx.font = `${fs}px system-ui`;
    ctx.textAlign = 'center';
    for (const c of CITIES) {
      const [x, y] = proj(c.lat, c.lng);
      if (x < -50 || x > W+50 || y < -50 || y > H+50) continue;
      // dot
      ctx.fillStyle = c.capital ? 'rgba(180,195,220,.5)' : 'rgba(140,160,190,.3)';
      ctx.beginPath();
      ctx.arc(x, y, c.capital ? 2.5 : 1.8, 0, Math.PI*2);
      ctx.fill();
      // label
      ctx.fillStyle = c.capital ? 'rgba(160,178,210,.55)' : 'rgba(130,150,180,.35)';
      ctx.fillText(c.name, x, y - 6);
    }
  }

  // Case markers
  const filtered = filter === 'all' ? CASES : CASES.filter(c => c.severity === filter);
  const mSize = Math.max(5, Math.min(14, 8 * scale));

  for (const c of filtered) {
    const [x, y] = proj(c.lat, c.lng);
    if (x < -40 || x > W+40 || y < -40 || y > H+40) continue;
    const s = SEV[c.severity];
    const isSel = selected?.id === c.id;
    const isHov = hovered === c.id;
    const r = isSel ? mSize * 1.3 : isHov ? mSize * 1.15 : mSize;

    // Outer glow
    const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
    glowGrad.addColorStop(0, s.c + '30');
    glowGrad.addColorStop(1, s.c + '00');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(x, y, r * 3, 0, Math.PI*2);
    ctx.fill();

    // Pulse for selected
    if (isSel) {
      const t = (Date.now() % 2000) / 2000;
      ctx.strokeStyle = s.c;
      ctx.lineWidth = 1.5 * (1-t);
      ctx.globalAlpha = 0.5 * (1-t);
      ctx.beginPath();
      ctx.arc(x, y, r * (1.5 + t * 2), 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Main circle
    ctx.fillStyle = s.c;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();

    // Stroke
    ctx.strokeStyle = isSel ? '#ffffff' : 'rgba(255,255,255,.18)';
    ctx.lineWidth = isSel ? 2 : 0.8;
    ctx.stroke();

    // Inner highlight
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.beginPath();
    ctx.arc(x - r*.2, y - r*.2, r*.35, 0, Math.PI*2);
    ctx.fill();

    // Label at zoom
    if (isSel || isHov || scale > 3) {
      const fs = Math.max(9, Math.min(13, 10 * scale / 2));
      ctx.font = `600 ${fs}px system-ui`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#e8eef6';
      ctx.fillText(c.name, x, y - r - 5);
      if (scale > 2) {
        ctx.font = `${fs * .75}px system-ui`;
        ctx.fillStyle = '#4a5a72';
        ctx.fillText(c.year + '', x, y - r - 5 + fs * .9);
      }
    }
  }

  if (selected) animFrame = requestAnimationFrame(draw);
}

function drawGeom(geom) {
  if (geom.type === 'Polygon') {
    drawPoly(geom.coordinates);
  } else if (geom.type === 'MultiPolygon') {
    for (const poly of geom.coordinates) drawPoly(poly);
  }
}

function drawPoly(rings) {
  ctx.beginPath();
  for (const ring of rings) {
    for (let i = 0; i < ring.length; i++) {
      const [x, y] = proj(ring[i][1], ring[i][0]);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
  }
  ctx.fill();
  ctx.stroke();
}

// Interaction
function getCase(px, py) {
  const filtered = filter === 'all' ? CASES : CASES.filter(c => c.severity === filter);
  const mSize = Math.max(5, Math.min(14, 8 * scale));
  let best = null, bestDist = Infinity;
  for (const c of filtered) {
    const [x, y] = proj(c.lat, c.lng);
    const d = Math.hypot(px - x, py - y);
    if (d < mSize * 2.5 && d < bestDist) {
      best = c;
      bestDist = d;
    }
  }
  return best;
}

cv.addEventListener('mousedown', e => {
  const c = getCase(e.offsetX, e.offsetY);
  if (c) return; // don't drag if clicking marker
  dragging = true;
  dragX = e.clientX; dragY = e.clientY;
  dragCx = cx; dragCy = cy;
  cv.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', e => {
  if (dragging) {
    const dx = (e.clientX - dragX) / ((W / 360) * scale);
    const dy = (e.clientY - dragY) / ((W / (2*Math.PI)) * scale);
    const cyR = cy * Math.PI / 180;
    cx = dragCx - dx;
    cy = dragCy + dy * (180/Math.PI) * Math.cos(cyR);
    cy = Math.max(-80, Math.min(80, cy));
    draw();
  }
});

window.addEventListener('mouseup', () => {
  dragging = false;
  cv.style.cursor = 'grab';
});

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1/1.15 : 1.15;
  scale = Math.max(0.5, Math.min(20, scale * factor));
  draw();
}, {passive: false});

// Touch
let lastTouchDist = 0;
cv.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    const c = getCase(e.touches[0].clientX - cv.getBoundingClientRect().left, e.touches[0].clientY - cv.getBoundingClientRect().top);
    if (!c) {
      dragging = true;
      dragX = e.touches[0].clientX; dragY = e.touches[0].clientY;
      dragCx = cx; dragCy = cy;
    }
  } else if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  }
}, {passive: true});

cv.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && dragging) {
    const dx = (e.touches[0].clientX - dragX) / ((W / 360) * scale);
    const dy = (e.touches[0].clientY - dragY) / ((W / (2*Math.PI)) * scale);
    const cyR = cy * Math.PI / 180;
    cx = dragCx - dx;
    cy = dragCy + dy * (180/Math.PI) * Math.cos(cyR);
    cy = Math.max(-80, Math.min(80, cy));
    draw();
  } else if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (lastTouchDist > 0) {
      scale = Math.max(0.5, Math.min(20, scale * (d / lastTouchDist)));
      draw();
    }
    lastTouchDist = d;
  }
}, {passive: false});

cv.addEventListener('touchend', () => { dragging = false; lastTouchDist = 0; });

// Hover
cv.addEventListener('mousemove', e => {
  if (dragging) return;
  const c = getCase(e.offsetX, e.offsetY);
  if (c && c.id !== hovered) {
    hovered = c.id;
    const s = SEV[c.severity];
    tip.innerHTML = `<div class="tn">${c.name}</div><div class="tm">${c.country} · ${c.year}${c.yearEnd ? '–'+c.yearEnd : ''}</div><span class="tt" style="background:${s.bg};color:${s.c}">${c.type}</span>`;
    tip.style.opacity = 1;
    const tx = Math.min(e.offsetX + 14, W - 240);
    const ty = e.offsetY - 60;
    tip.style.left = tx + 'px';
    tip.style.top = Math.max(5, ty) + 'px';
    cv.style.cursor = 'pointer';
    draw();
  } else if (!c && hovered) {
    hovered = null;
    tip.style.opacity = 0;
    cv.style.cursor = 'grab';
    draw();
  } else if (c) {
    const tx = Math.min(e.offsetX + 14, W - 240);
    const ty = e.offsetY - 60;
    tip.style.left = tx + 'px';
    tip.style.top = Math.max(5, ty) + 'px';
  }
});

// Click
cv.addEventListener('click', e => {
  const c = getCase(e.offsetX, e.offsetY);
  if (c) {
    selected = c;
    showPanel(c);
    // highlight timeline
    document.querySelectorAll('.tl .dot').forEach(d => d.classList.remove('sel'));
    const el = document.getElementById('tl'+c.id);
    if (el) el.classList.add('sel');
    draw();
  }
});

// Touch click for markers
cv.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    const rect = cv.getBoundingClientRect();
    const c = getCase(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
    if (c) {
      selected = c;
      showPanel(c);
      draw();
    }
  }
}, {passive: true});

function showPanel(c) {
  const s = SEV[c.severity];
  panel.style.display = 'block';
  panel.innerHTML = `
    <div class="bar" style="background:linear-gradient(90deg,${s.c},transparent)"></div>
    <div class="inner">
      <div class="ph">
        <div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="width:10px;height:10px;border-radius:50%;background:${s.c};display:inline-block"></span>
            <span class="pn">${c.name}</span>
          </div>
          <div class="pm">${c.country} · ${c.year}${c.yearEnd?'–'+c.yearEnd:''}</div>
        </div>
        <button class="close" onclick="closePanel()">✕</button>
      </div>
      <span class="pt" style="background:${s.bg};color:${s.c}">${c.type}</span>
      <div class="ps">${c.summary}</div>
      <div class="pg">
        <div class="pb"><div class="pl">Root Cause</div><div class="pv">${c.cause}</div></div>
        <div class="pb"><div class="pl">Outcome</div><div class="pv">${c.outcome}</div></div>
      </div>
    </div>`;
}

function closePanel() {
  panel.style.display = 'none';
  selected = null;
  cancelAnimationFrame(animFrame);
  draw();
}

function zoomBy(f) { scale = Math.max(0.5, Math.min(20, scale * f)); draw(); }
function resetView() { cx=0; cy=0; scale=1; selected=null; panel.style.display='none'; cancelAnimationFrame(animFrame); draw(); }
function flyTo(c) {
  cx = c.lng; cy = c.lat; scale = 4;
  selected = c;
  showPanel(c);
  document.querySelectorAll('.tl .dot').forEach(d => d.classList.remove('sel'));
  const el = document.getElementById('tl'+c.id);
  if (el) el.classList.add('sel');
  draw();
}

// Filters
const filtersEl = document.getElementById('filters');
[['all',null,'All'],['fatal','#ef4444','Fatal'],['critical','#f59e0b','Critical'],['chronic','#eab308','Chronic'],['stressed','#3b82f6','Stressed']].forEach(([k,color,label]) => {
  const b = document.createElement('button');
  b.className = 'fbtn' + (k==='all'?' on':'');
  b.dataset.f = k;
  b.innerHTML = (color?`<span class="fdot" style="background:${color}"></span>`:'') + label;
  b.onclick = () => {
    filter = k;
    document.querySelectorAll('.fbtn').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    buildTimeline();
    updateStats();
    draw();
  };
  filtersEl.appendChild(b);
});

// Stats
function updateStats() {
  const f = filter==='all'?CASES:CASES.filter(c=>c.severity===filter);
  const statsEl = document.getElementById('statsBar');
  statsEl.innerHTML = Object.entries(SEV).map(([k,v]) => {
    const n = f.filter(c=>c.severity===k).length;
    return `<div class="stat"><div class="n" style="color:${v.c}">${n}</div><div class="l">${k}</div></div>`;
  }).join('');
}
updateStats();

// Timeline
function buildTimeline() {
  const tl = document.getElementById('timeline');
  const sorted = [...CASES].filter(c=>filter==='all'||c.severity===filter).sort((a,b)=>a.year-b.year);
  tl.innerHTML = '';
  let last = 0;
  sorted.forEach(c => {
    const dec = Math.floor(c.year/50)*50;
    if (dec !== last) {
      const sp = document.createElement('span');
      sp.className = 'yr';
      sp.textContent = dec + 's';
      tl.appendChild(sp);
      last = dec;
    }
    const d = document.createElement('div');
    d.className = 'dot' + (selected?.id===c.id?' sel':'');
    d.id = 'tl'+c.id;
    d.style.background = SEV[c.severity].c;
    d.style.boxShadow = `0 0 6px ${SEV[c.severity].c}40`;
    d.title = `${c.name} (${c.year})`;
    d.onclick = () => flyTo(c);
    tl.appendChild(d);
  });
}
buildTimeline();

cv.style.cursor = 'grab';
resize();
</script>
</body>
