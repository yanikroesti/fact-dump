<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title"><title id="title">Speichern oder direkt abgeben?</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#a54c23"/></marker></defs><rect width="1000" height="300" fill="#fffdf8"/><g font-family="Arial,sans-serif"><text x="26" y="38" font-size="27" fill="#20332e">Speichern oder direkt abgeben?</text><rect x="35.0" y="95" width="270.0" height="110" rx="6" fill="#edf3ee" stroke="#9caea4" stroke-width="2"/><text x="49.0" y="133" font-size="21" fill="#20332e">Speicherheizung</text><text x="49.0" y="173" font-size="17" fill="#20332e">Laden → Speichern</text><path d="M307.0 150 L331.0 150" stroke="#a54c23" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="335.0" y="95" width="270.0" height="110" rx="6" fill="#edf3ee" stroke="#9caea4" stroke-width="2"/><text x="349.0" y="133" font-size="21" fill="#20332e">Zeitversetzt</text><text x="349.0" y="173" font-size="17" fill="#20332e">Statisch / mit Lüfter</text><path d="M607.0 150 L631.0 150" stroke="#a54c23" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="635.0" y="95" width="270.0" height="110" rx="6" fill="#edf3ee" stroke="#9caea4" stroke-width="2"/><text x="649.0" y="133" font-size="21" fill="#20332e">Direktheizung</text><text x="649.0" y="173" font-size="17" fill="#20332e">Erzeugen + abgeben</text><text x="35" y="265" font-size="20" fill="#20332e">Statische Abgabe: Strahlung / natürliche Konvektion. Dynamisch: zusätzlich Lüfter.</text></g></svg>