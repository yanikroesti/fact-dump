<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 515" role="img" aria-labelledby="title"><title id="title">Energieregler: Leistung über der Zeit</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#a54c23"/></marker></defs><rect width="1000" height="515" fill="#fffdf8"/><g font-family="Arial,sans-serif"><text x="26" y="38" font-size="27" fill="#20332e">Energieregler: Leistung über der Zeit</text><text x="45" y="85" font-size="23" fill="#20332e">100 %: ständig eingeschaltet</text><path d="M100 215 L940 215" stroke="#20332e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M100 215 L100 103" stroke="#20332e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="125" font-size="18" fill="#20332e">Pmax</text><text x="940" y="240" font-size="18" fill="#20332e">t</text><rect x="105" y="120" width="200" height="95" fill="#d88e6b" stroke="#a54c23"/><rect x="305" y="120" width="200" height="95" fill="#d88e6b" stroke="#a54c23"/><rect x="505" y="120" width="200" height="95" fill="#d88e6b" stroke="#a54c23"/><rect x="705" y="120" width="200" height="95" fill="#d88e6b" stroke="#a54c23"/><text x="45" y="255" font-size="23" fill="#20332e">13 %: kurze Einschaltzeit</text><path d="M100 385 L940 385" stroke="#20332e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M100 385 L100 273" stroke="#20332e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="295" font-size="18" fill="#20332e">Pmax</text><text x="940" y="410" font-size="18" fill="#20332e">t</text><rect x="105" y="290" width="26.0" height="95" fill="#d88e6b" stroke="#a54c23"/><rect x="305" y="290" width="26.0" height="95" fill="#d88e6b" stroke="#a54c23"/><rect x="505" y="290" width="26.0" height="95" fill="#d88e6b" stroke="#a54c23"/><rect x="705" y="290" width="26.0" height="95" fill="#d88e6b" stroke="#a54c23"/><path d="M100 372.65H910" stroke="#315f8b" stroke-width="3" stroke-dasharray="8 6"/><text x="115" y="419" font-size="20" fill="#20332e">T = 20 s · t_ein = 2,6 s · P̄ = 0,13 × Pmax</text><text x="40" y="480" font-size="20" fill="#20332e">Beispiel: 2000 W × 0,13 = 260 W mittlere Leistung. Während EIN: volle 2000 W.</text></g></svg>