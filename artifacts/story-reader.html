<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A1–A3 Drohnenkurs — BAZL Ausbildungsunterlagen</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #09090e;
    --surface:     #101018;
    --card:        #14141e;
    --border:      rgba(160,145,220,0.10);
    --border-h:    rgba(160,145,220,0.30);
    --accent:      #a391dc;
    --accent-glow: rgba(163,145,220,0.07);
    --text:        #ece9f5;
    --muted:       #7b7894;
    --dim:         #3f3d55;
    --num:         rgba(163,145,220,0.55);
  }
  [data-theme="light"] {
    --bg:          #f0edf8;
    --surface:     #ffffff;
    --card:        #f8f6fd;
    --border:      rgba(95,75,170,0.12);
    --border-h:    rgba(95,75,170,0.32);
    --accent:      #6248b4;
    --accent-glow: rgba(98,72,180,0.06);
    --text:        #18151f;
    --muted:       #5a5472;
    --dim:         #c2bdd6;
    --num:         rgba(98,72,180,0.45);
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { height:100%; }
  body {
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Lora',serif;
    transition:background .3s,color .3s;
    overflow-x:hidden;
  }

  /* ─── PIN SCREEN ─── */
  #pin-screen {
    position:fixed;
    inset:0;
    z-index:200;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:2rem 1.5rem;
    gap:0;
  }
  #pin-screen.hidden { display:none; }

  .pin-eyebrow {
    font-size:.62rem;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:.9rem;
    opacity:.85;
  }
  .pin-title {
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(2rem,9vw,3rem);
    font-weight:300;
    color:var(--text);
    letter-spacing:-.01em;
    margin-bottom:2.5rem;
    text-align:center;
  }

  /* dot display */
  .pin-dots {
    display:flex;
    gap:1rem;
    margin-bottom:2.5rem;
  }
  .pin-dot {
    width:12px;
    height:12px;
    border-radius:50%;
    border:1.5px solid var(--accent);
    background:transparent;
    transition:background .15s, transform .15s;
  }
  .pin-dot.filled {
    background:var(--accent);
    transform:scale(1.15);
  }

  /* error state */
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
  }
  .pin-dots.error { animation:shake .35s ease; }
  .pin-dot.error-dot { border-color:#c06080; background:#c06080; }

  /* error label */
  .pin-error {
    font-size:.72rem;
    letter-spacing:.08em;
    color:#c06080;
    margin-bottom:1.5rem;
    height:1rem;
    opacity:0;
    transition:opacity .2s;
  }
  .pin-error.visible { opacity:1; }

  /* keypad */
  .keypad {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:.65rem;
    width:100%;
    max-width:260px;
  }
  .key {
    aspect-ratio:1;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-family:'Cormorant Garamond',serif;
    font-size:1.6rem;
    font-weight:300;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s, border-color .15s, transform .1s;
    user-select:none;
  }
  .key:active { transform:scale(.93); background:var(--accent-glow); border-color:var(--accent); }
  .key:hover { border-color:var(--border-h); }
  .key.key-del {
    font-size:1.1rem;
    color:var(--muted);
    border-color:transparent;
    background:transparent;
  }
  .key.key-del:hover { color:var(--accent); }
  .key.key-empty {
    border:none;
    background:none;
    cursor:default;
    pointer-events:none;
  }

  /* ─── HOME ─── */
  #home {
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }
  #home.hidden { display:none; }

  .bar {
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:.85rem 1.25rem;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:20;
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }

  .pill-btn {
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    padding:.38rem .9rem;
    border-radius:2rem;
    font-size:.7rem;
    font-family:'Lora',serif;
    letter-spacing:.09em;
    cursor:pointer;
    transition:border-color .2s,color .2s;
    white-space:nowrap;
  }
  .pill-btn:hover { border-color:var(--accent); color:var(--accent); }

  .hero {
    padding:3.5rem 1.5rem 2.25rem;
    text-align:center;
    position:relative;
  }
  .hero::before {
    content:'';
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:1px; height:3rem;
    background:linear-gradient(to bottom,transparent,var(--accent));
    opacity:.6;
  }
  .eyebrow {
    font-size:.65rem;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:1.25rem;
    opacity:.9;
  }
  .main-title {
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(2.6rem,11vw,4rem);
    font-weight:300;
    line-height:1.05;
    letter-spacing:-.01em;
    color:var(--text);
    margin-bottom:1rem;
  }
  .tagline {
    font-size:.82rem;
    font-style:italic;
    color:var(--muted);
    margin-bottom:2.5rem;
    line-height:1.6;
  }
  .rule {
    display:flex;
    align-items:center;
    gap:.85rem;
    margin:0 1.5rem 2rem;
  }
  .rule::before,.rule::after {
    content:'';
    flex:1;
    height:1px;
    background:var(--border);
  }
  .rule span { font-size:.45rem; color:var(--accent); opacity:.7; }

  .chapters { flex:1; padding:0 1rem 5rem; }

  .ch {
    display:flex;
    align-items:center;
    padding:1.1rem .75rem;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:background .2s;
  }
  .ch:first-child { border-top:1px solid var(--border); }
  .ch::before {
    content:'';
    position:absolute;
    left:0; top:0; bottom:0;
    width:0;
    background:var(--accent);
    transition:width .22s cubic-bezier(.4,0,.2,1);
    border-radius:0 1px 1px 0;
  }
  .ch:hover::before { width:2px; }
  .ch:hover { background:var(--accent-glow); }
  .ch-num {
    font-family:'Cormorant Garamond',serif;
    font-size:.9rem;
    color:var(--num);
    min-width:2.2rem;
    font-weight:300;
    letter-spacing:.04em;
    flex-shrink:0;
  }
  .ch-name {
    flex:1;
    font-family:'Cormorant Garamond',serif;
    font-size:1.22rem;
    font-weight:400;
    line-height:1.3;
    padding-left:.25rem;
    color:var(--text);
  }
  .ch-arr {
    color:var(--dim);
    font-size:.95rem;
    transition:transform .2s,color .2s;
    flex-shrink:0;
    margin-left:.5rem;
  }
  .ch:hover .ch-arr { transform:translateX(4px); color:var(--accent); }

  @keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  .ch { animation:rise .45s ease both; }
  .ch:nth-child(1){animation-delay:.04s} .ch:nth-child(2){animation-delay:.09s}
  .ch:nth-child(3){animation-delay:.14s} .ch:nth-child(4){animation-delay:.19s}
  .ch:nth-child(5){animation-delay:.24s} .ch:nth-child(6){animation-delay:.29s}
  .ch:nth-child(7){animation-delay:.34s} .ch:nth-child(8){animation-delay:.39s}
  .ch:nth-child(9){animation-delay:.44s}

  /* ─── READER ─── */
  #reader {
    display:none;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    position:fixed;
    inset:0;
    z-index:100;
    background:var(--bg);
  }
  #reader.active { display:flex; }

  .reader-bar {
    display:flex;
    align-items:center;
    gap:.75rem;
    padding:.75rem 1rem;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .back-btn {
    display:flex;
    align-items:center;
    gap:.4rem;
    background:none;
    border:1px solid var(--border);
    color:var(--text);
    padding:.38rem .85rem;
    border-radius:2rem;
    font-family:'Lora',serif;
    font-size:.7rem;
    letter-spacing:.06em;
    cursor:pointer;
    transition:border-color .2s,color .2s;
    white-space:nowrap;
    flex-shrink:0;
  }
  .back-btn:hover { border-color:var(--accent); color:var(--accent); }
  .reader-title {
    font-family:'Cormorant Garamond',serif;
    font-size:1rem;
    font-weight:400;
    color:var(--muted);
    flex:1;
    text-align:center;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  #pdf-frame {
    flex:1;
    width:100%;
    border:none;
    background:var(--bg);
    display:block;
  }
</style>
</head>
<body>

<!-- ── PIN SCREEN ── -->
<div id="pin-screen">
  <p class="pin-eyebrow">Enter PIN to continue</p>
  <h1 class="pin-title">A1–A3 Drohnenkurs</h1>

  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>

  <div class="pin-error" id="pin-error">Incorrect PIN</div>

  <div class="keypad">
    <button class="key" onclick="pinPress('1')">1</button>
    <button class="key" onclick="pinPress('2')">2</button>
    <button class="key" onclick="pinPress('3')">3</button>
    <button class="key" onclick="pinPress('4')">4</button>
    <button class="key" onclick="pinPress('5')">5</button>
    <button class="key" onclick="pinPress('6')">6</button>
    <button class="key" onclick="pinPress('7')">7</button>
    <button class="key" onclick="pinPress('8')">8</button>
    <button class="key" onclick="pinPress('9')">9</button>
    <button class="key key-empty"></button>
    <button class="key" onclick="pinPress('0')">0</button>
    <button class="key key-del" onclick="pinDel()">⌫</button>
  </div>
</div>

<!-- ── HOME VIEW ── -->
<div id="home" class="hidden">
  <div class="bar">
    <button class="pill-btn" id="theme-btn" onclick="toggleTheme()">☀ Light</button>
  </div>
  <div class="hero">
    <p class="eyebrow">BAZL Ausbildung · 9 Module</p>
    <h1 class="main-title">A1–A3 Drohnenkurs</h1>
    <p class="tagline">Alle Kursunterlagen der BAZL-Fernpiloten-Ausbildung A1/A3</p>
  </div>
  <div class="rule"><span>◆</span></div>
  <div class="chapters" id="chapter-list"></div>
</div>

<!-- ── READER VIEW ── -->
<div id="reader">
  <div class="reader-bar">
    <button class="back-btn" onclick="goHome()">← Back</button>
    <span class="reader-title" id="reader-title">—</span>
    <button class="pill-btn" id="theme-btn-r" onclick="toggleTheme()">☀ Light</button>
  </div>
  <iframe id="pdf-frame" src="" title="PDF Reader" allowfullscreen></iframe>
</div>

<script>
  // ╔══════════════════════════════════╗
  // ║  CHANGE YOUR PIN HERE ↓          ║
  const CORRECT_PIN = '3600';
  // ╚══════════════════════════════════╝


  // ── DATA — edit names and PDF paths here ──
  const chapters = [
    { name: "Modul 01_Luftrecht_UA-Ausbildung",     				pdf: "A1-A3 BAZL course/Modul 01_Luftrecht_UA-Ausbildung.pdf" },
    { name: "Modul 02_ 03_Sicherheit im Luftraum_UA-Ausbildung",       		pdf: "A1-A3 BAZL course/Modul 02_ 03_Sicherheit im Luftraum_UA-Ausbildung.pdf" },
    { name: "Modul 04_Menschliches Leistungsvermögen_UA-Ausbildung",   		pdf: "A1-A3 BAZL course/Modul 04_Menschliches Leistungsvermögen_UA-Ausbildung.pdf" },
    { name: "Modul 05_Betriebsverfahren_UA-Ausbildung",     			pdf: "A1-A3 BAZL course/Modul 05_Betriebsverfahren_UA-Ausbildung.pdf" },
    { name: "Modul 06_Allgemeine UAS-Kenntnisse_UA-Ausbildung",  		pdf: "A1-A3 BAZL course/Modul 06_Allgemeine UAS-Kenntnisse_UA-Ausbildung.pdf" },
    { name: "Modul 07_Privatsphären- und Datenschutz_UA-Ausbildung",          	pdf: "A1-A3 BAZL course/Modul 07_Privatsphären- und Datenschutz_UA-Ausbildung.pdf" },
    { name: "Modul 08_Versicherung_UA-Ausbildung",    			   	pdf: "A1-A3 BAZL course/Modul 08_Versicherung_UA-Ausbildung.pdf" },
    { name: "Modul 09_Sicherheit_UA-Ausbildung",    				pdf: "A1-A3 BAZL course/Modul 09_Sicherheit_UA-Ausbildung.pdf" },
  ];
  // ── PIN LOGIC ──
  let pinInput = '';
  const pinLen = CORRECT_PIN.length;

  function updateDots() {
    for (let i = 0; i < pinLen; i++) {
      const dot = document.getElementById('d' + i);
      dot.classList.toggle('filled', i < pinInput.length);
    }
  }

  function pinPress(digit) {
    if (pinInput.length >= pinLen) return;
    pinInput += digit;
    updateDots();
    if (pinInput.length === pinLen) {
      setTimeout(checkPin, 120);
    }
  }

  function pinDel() {
    pinInput = pinInput.slice(0, -1);
    updateDots();
    clearError();
  }

  function checkPin() {
    if (pinInput === CORRECT_PIN) {
      document.getElementById('pin-screen').classList.add('hidden');
      document.getElementById('home').classList.remove('hidden');
    } else {
      const dots = document.getElementById('pin-dots');
      const allDots = dots.querySelectorAll('.pin-dot');
      allDots.forEach(d => d.classList.add('error-dot'));
      dots.classList.add('error');
      document.getElementById('pin-error').classList.add('visible');
      setTimeout(() => {
        dots.classList.remove('error');
        allDots.forEach(d => d.classList.remove('error-dot','filled'));
        pinInput = '';
        clearError();
      }, 700);
    }
  }

  function clearError() {
    document.getElementById('pin-error').classList.remove('visible');
  }

  // ── RENDER CHAPTERS ──
  const list = document.getElementById('chapter-list');
  chapters.forEach((ch, i) => {
    const div = document.createElement('div');
    div.className = 'ch';
    div.innerHTML =
      `<span class="ch-num">${String(i+1).padStart(2,'0')}</span>` +
      `<span class="ch-name">${ch.name}</span>` +
      `<span class="ch-arr">→</span>`;
    div.addEventListener('click', () => openChapter(i));
    list.appendChild(div);
  });

  // ── THEME ──
  let dark = true;
  function updateThemeLabel() {
    const lbl = dark ? '☀ Light' : '☾ Dark';
    document.getElementById('theme-btn').textContent = lbl;
    document.getElementById('theme-btn-r').textContent = lbl;
  }
  function toggleTheme() {
    dark = !dark;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    updateThemeLabel();
  }

  // ── NAVIGATION ──
  function openChapter(i) {
    const ch = chapters[i];
    document.getElementById('pdf-frame').src = ch.pdf;
    document.getElementById('reader-title').textContent = ch.name;
    document.getElementById('home').classList.add('hidden');
    document.getElementById('reader').classList.add('active');
  }
  function goHome() {
    document.getElementById('reader').classList.remove('active');
    document.getElementById('home').classList.remove('hidden');
    document.getElementById('pdf-frame').src = '';
  }
</script>
</body>
</html>
